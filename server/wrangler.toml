name = "pspp-studio-api"
main = "src/index.ts"
compatibility_date = "2025-11-01"

# Free plan only: D1 for accounts and the project index, a SQLite-backed Durable Object per project for its data.
# No R2 (it asks for a payment card even on the free tier).

[[d1_databases]]
binding = "DB"
database_name = "pspp-studio"
database_id = "40539e3a-c856-4e08-8d4a-d5ef6127a17f"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "PROJECT"
class_name = "ProjectDO"

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "EngineDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EngineDO"]

[vars]
# Comma separated list of web origins that may call the API (CORS).
ALLOWED_ORIGINS = "https://pspp-studio.vercel.app,http://localhost:5173,http://localhost:4181"
# Hard caps that keep the beta inside the free tier.
MAX_USERS = "30"
USER_QUOTA_BYTES = "52428800"
PROJECT_MAX_BYTES = "20971520"
# ADMIN_KEY is a secret: `npx wrangler secret put ADMIN_KEY`
